  <div class="main">

      <section class="center">
        <div id="grid" class="grid"></div>

        <div id="bottom" class="bottom collapsed">
          <div class="bottom-resize" id="bottomResize" title="Drag to resize"></div>
          <div class="tabs" id="bottomTabs">
            <button data-tab="tester" class="active">Strategy tester</button>
            <button data-tab="screener">Screener</button>

            <button data-tab="seasonals">Seasonals</button>
            <button data-tab="financials">Financials</button>
            <button data-tab="paper">Paper trading</button>

          </div>
          <div class="tab-body" id="bottomBody"></div>
        </div>
      </section>
      <aside class="side" id="side">
        <div class="side-resize" id="sideResize" title="Drag to resize"></div>
        <div class="tab-body" id="sideBody"></div>
      </aside>
      <!-- TradingView's right toolbar: the panels at the top; the starred products, the Products
           menu and Help at the bottom -->
      <nav class="rail" id="rail">
        <button data-panel="watchlist" data-tip="Watchlist, details and news">
          <svg viewBox="0 0 28 28"><path d="M5 2.5h18v23l-9-5.5-9 5.5z" /><path d="M9 8h10M9 12h10" /></svg>

        <button data-panel="alerts" data-tip="Alerts">

        </button>
        <span class="rail-fill"></span>
        <div class="rail-favs" id="railFavs"></div>
        <button data-act="products" data-tip="Products" class="rail-products">

        </button>
      </nav>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>
